# Tests every push and pull request. A v* tag builds the signed APK and publishes the GitHub release.
# Release signing needs repository secrets: QUANTM_KEYSTORE_BASE64 (the .jks, base64) and QUANTM_KEYSTORE_PASSWORD.
name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug build
        run: ./gradlew testDebugUnitTest assembleDebug --console=plain

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag matches gradle.properties
        run: |
          VERSION=$(sed -n 's/^quantm\.version=//p' gradle.properties | tr -d '[:space:]')
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match quantm.version=$VERSION"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.QUANTM_KEYSTORE_BASE64 }}
          QUANTM_KEYSTORE_PASSWORD: ${{ secrets.QUANTM_KEYSTORE_PASSWORD }}
          QUANTM_KEYSTORE_ALIAS: quantm
          QUANTM_KEYSTORE_FILE: release.jks
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "The QUANTM_KEYSTORE_BASE64 secret is missing"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          ./gradlew assembleRelease --console=plain
          rm release.jks
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Quantm-$VERSION.apk"
          cd out && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/* --title "Quantm for Android $VERSION" --notes-file .github/RELEASE_NOTES.md
